name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Must satisfy package.json "engines". On Node 20, jsdom's bundled undici
      # is missing an API it needs, every test worker crashes, and no test runs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build & Bundle Check
        run: npm run build
